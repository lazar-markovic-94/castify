# =============================================================================
# Builds a container image, pushes it to GHCR, and rolls the Hetzner stack
# over to it. Triggered on every push to develop.
#
# Server prerequisites are created by deploy/bootstrap-server.sh.
# Required secrets: HETZNER_SERVER_IP, HETZNER_SSH_KEY
# =============================================================================

name: Deploy Backend to Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to roll back to (e.g. sha-1a2b3c4). Leave blank to build HEAD.'
        required: false
        default: ''

# Never let two deploys race for the same server.
concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build image and deploy to Hetzner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Produces ghcr.io/<owner>/<repo>:develop and :sha-<short>, lowercased.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        if: inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Hetzner Cloud is x86_64. Pinned explicitly so an image built on an
          # arm64 machine (an Apple Silicon laptop, an arm runner) can never be
          # pushed as :develop and fail to start on the server.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A manual run with image_tag set skips the build and redeploys an
      # image that already exists in the registry - that is the rollback path.
      - name: Resolve image to deploy
        id: image
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          REPO="${REPO,,}"                       # GHCR rejects uppercase
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "ref=${REPO}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "Rolling back to ${REPO}:${{ inputs.image_tag }}"
          else
            echo "ref=${REPO}:sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SERVER_IP: ${{ secrets.HETZNER_SERVER_IP }}
          APP_IMAGE: ${{ steps.image.outputs.ref }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null

          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@${SERVER_IP}"

          # Refresh the stack definition from the repo so the server never
          # drifts from what is committed here.
          scp -i ~/.ssh/deploy_key \
            deploy/docker-compose.prod.yml deploy/Caddyfile deploy/backup.sh \
            deploy/dc deploy/healthcheck.sh \
            "root@${SERVER_IP}:/opt/castify/"
          $SSH "chmod 750 /opt/castify/backup.sh /opt/castify/dc /opt/castify/healthcheck.sh"

          # The job's GITHUB_TOKEN is enough to pull; no long-lived registry
          # credential is stored on the server.
          $SSH "echo '${REGISTRY_TOKEN}' | docker login ghcr.io -u '${REGISTRY_USER}' --password-stdin"

          $SSH "printf 'APP_IMAGE=%s\n' '${APP_IMAGE}' > /opt/castify/.env.image"
          $SSH "cd /opt/castify && ./dc pull && ./dc up -d --remove-orphans"

          $SSH "docker logout ghcr.io >/dev/null 2>&1 || true"

      - name: Verify health
        env:
          SERVER_IP: ${{ secrets.HETZNER_SERVER_IP }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "root@${SERVER_IP}" "/opt/castify/healthcheck.sh" \
            || { echo "::error::Service did not become healthy after deploy"; exit 1; }

      - name: Prune old images
        if: success()
        env:
          SERVER_IP: ${{ secrets.HETZNER_SERVER_IP }}
        run: |
          ssh -i ~/.ssh/deploy_key root@${SERVER_IP} \
            "docker image prune -af --filter 'until=168h'" || true
