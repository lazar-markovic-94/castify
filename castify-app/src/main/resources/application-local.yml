# Local Development Profile
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/castify
    username: ${DB_USERNAME:lazarmarkovic}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false
    clean-on-validation-error: false

# Local server configuration
server:
  port: 8080

# Swagger UI enabled for local development
springdoc:
  swagger-ui:
    enabled: true

# Detailed logging for local development
logging:
  level:
    root: INFO
    com.castify: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
  file:
    name: logs/castify-local.log
    max-size: 10MB
    max-history: 7

# Local file upload directory
file:
  upload:
    dir: uploads
