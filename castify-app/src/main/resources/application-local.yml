# Local Development Profile
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/castify
    username: ${DB_USERNAME:lazarmarkovic}
    password: ${DB_PASSWORD:}

  jpa:
    show-sql: false  # Disabled for cleaner logs
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false
    clean-on-validation-error: false

# Local server configuration
server:
  port: 8080

# Swagger UI enabled for local development
springdoc:
  swagger-ui:
    enabled: true

# Detailed logging for local development
logging:
  level:
    root: INFO
    com.castify: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    # Turn OFF Hibernate SQL logging for clearer logs
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.flywaydb: INFO
  file:
    name: logs/castify-local.log
    max-size: 10MB
    max-history: 7

# Local file upload directory
file:
  upload:
    dir: uploads

# Local CORS configuration - allow multiple localhost ports for development
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:4200
  mail:
    from: noreply@castify.com
    from-name: Castify Team (Local Dev)

# Local email configuration - Add your Gmail credentials here for testing
# IMPORTANT: Never commit these credentials to Git!
# For Gmail:
#   1. Enable 2FA on your Gmail account
#   2. Generate app password at: https://myaccount.google.com/apppasswords
#   3. Replace the values below with your credentials
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_EMAIL@gmail.com  # Replace with your Gmail
    password: YOUR_APP_PASSWORD      # Replace with your 16-char app password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
