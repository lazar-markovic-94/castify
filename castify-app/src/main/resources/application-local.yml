# Local Development Profile
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/castify
    # Defaults match docker-compose.yml so a fresh checkout runs with no env vars.
    # Override with DB_USERNAME / DB_PASSWORD to point at a different local role.
    username: ${DB_USERNAME:castify}
    password: ${DB_PASSWORD:castify123}

  jpa:
    show-sql: false  # Disabled for cleaner logs
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false
    clean-on-validation-error: false

# Local server configuration
server:
  port: 8080

# Swagger UI enabled for local development
springdoc:
  swagger-ui:
    enabled: true

# Detailed logging for local development
logging:
  level:
    root: INFO
    com.castify: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    # Turn OFF Hibernate SQL logging for clearer logs
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.flywaydb: INFO
  file:
    name: logs/castify-local.log
    max-size: 10MB
    max-history: 7

# Local file upload directory
file:
  upload:
    dir: uploads

# Local CORS configuration - allow multiple localhost ports for development
app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:4200
