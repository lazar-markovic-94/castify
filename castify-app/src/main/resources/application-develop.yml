# Development/Staging Environment Profile
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://dev-db-server:5432/castify_dev}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    clean-disabled: true
    clean-on-validation-error: false

# Development server configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: on_param

# Swagger UI enabled for development
springdoc:
  swagger-ui:
    enabled: true

# Moderate logging for development
logging:
  level:
    root: INFO
    com.castify: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.flywaydb: INFO
  file:
    name: /var/log/castify/castify-develop.log
    max-size: 50MB
    max-history: 30

# Development file upload directory
file:
  upload:
    dir: ${UPLOAD_DIR:/var/castify/uploads}

# JWT with environment variable
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  cors:
    # Development/staging origins - configure via ALLOWED_ORIGINS environment variable
    # Example: ALLOWED_ORIGINS=https://dev.castify.com,https://staging.castify.com
    allowed-origins: ${ALLOWED_ORIGINS}
