spring:
  application:
    name: castify

  # Default profile is local
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Common datasource configuration
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Common JPA configuration
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false  # Use logging instead for production
        use_sql_comments: true
        jdbc:
          batch_size: 20
          time_zone: UTC
          fetch_size: 50
        order_inserts: true
        order_updates: true
        # Optimistic locking settings
        jpa:
          compliance:
            global_id_generators: true
        # Second-level cache (optional - configure if needed)
        cache:
          use_second_level_cache: false
          use_query_cache: false
        # Connection isolation level
        connection:
          isolation: 2  # READ_COMMITTED (default for PostgreSQL)
        # Query optimization
        query:
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true
        # Statistics for monitoring
        generate_statistics: false  # Set true in dev/test only
    defer-datasource-initialization: false
    open-in-view: false
    # Show parameter binding in logs (dev only)
    show-sql: false

  # Common Flyway configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # Common multipart configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 0

# Common server configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Application-specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-please-make-it-long-enough}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

file:
  upload:
    dir: ${UPLOAD_DIR:uploads}

# Common Springdoc configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Common logging pattern
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
