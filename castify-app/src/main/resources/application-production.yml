# Production Environment Profile
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  flyway:
    clean-disabled: true
    clean-on-validation-error: false
    out-of-order: false

# Production server configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10

# Disable Swagger UI in production for security
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Minimal logging for production
logging:
  level:
    root: WARN
    com.castify: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
  file:
    name: /var/log/castify/castify-production.log
    max-size: 100MB
    max-history: 90
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Production file upload directory
file:
  upload:
    dir: ${UPLOAD_DIR:/var/castify/uploads}

# JWT must be provided via environment variable
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours
  cors:
    # CRITICAL: Set production origins via ALLOWED_ORIGINS environment variable
    # Example: ALLOWED_ORIGINS=https://castify.com,https://app.castify.com,https://www.castify.com
    allowed-origins: ${ALLOWED_ORIGINS}

# Spring Boot Actuator for production monitoring (if enabled)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
